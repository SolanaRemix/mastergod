{
  "blueprintVersion": "1.0",
  "project": {
    "id": "master-gods",
    "name": "Master GODS",
    "version": "9.0.0",
    "purpose": "Help users describe an application, review its requirements, and retain an evidence-aware project blueprint."
  },
  "requirements": [
    {
      "id": "REQ-BUILDER-001",
      "description": "Users can describe an application in ordinary language and receive an editable requirement draft.",
      "status": "VERIFIED"
    },
    {
      "id": "REQ-BLUEPRINT-001",
      "description": "Approved project requirements and planning artifacts are persisted in a project-specific gods.blueprint.yaml file.",
      "status": "VERIFIED"
    },
    {
      "id": "REQ-ORCHESTRATION-001",
      "description": "Project task contracts and dependency-aware task states are retained for review.",
      "status": "PARTIALLY_IMPLEMENTED"
    },
    {
      "id": "REQ-PROVIDERS-001",
      "description": "Configured AI providers execute code-generation and verification tasks.",
      "status": "BLOCKED"
    },
    {
      "id": "REQ-IDENTITY-001",
      "description": "Users authenticate and receive server-enforced project ownership in SQLite; the configured super-admin requires explicit password-verified operator provisioning.",
      "status": "PARTIALLY_IMPLEMENTED"
    },
    {
      "id": "REQ-CICD-001",
      "description": "Pull requests and main pushes run Node 22.13/24 syntax, blueprint, and automated-test checks; a protected production deployment is gated on all release checks.",
      "status": "IMPLEMENTED_UNVERIFIED"
    },
    {
      "id": "REQ-GAME-STUDIO-001",
      "description": "Signed-in users can create original deterministic 2D Canvas game projects, inspect a beginner-readable plan, and run a network-restricted preview.",
      "status": "IMPLEMENTED_UNVERIFIED"
    },
    {
      "id": "REQ-GAME-VERSIONS-001",
      "description": "Game project versions and validated local progress are persisted in SQLite with owner checks and non-destructive restore.",
      "status": "IMPLEMENTED_UNVERIFIED"
    },
    {
      "id": "REQ-GAME-AI-001",
      "description": "Provider-backed multi-agent game planning, source generation, assets, and QA execute and verify complete 2D and 3D games.",
      "status": "BLOCKED"
    },
    {
      "id": "REQ-PRODUCTION-DEPLOY-001",
      "description": "Deploy verified artifacts to a configured production host and confirm production readiness from a post-deploy health read.",
      "status": "BLOCKED"
    }
  ],
  "runtime": {
    "language": "JavaScript",
    "minimumNodeVersion": "22.13.0",
    "dependencies": [],
    "persistence": "SQLite users, sessions, project records, private game projects, game versions, and validated game saves"
  },
  "gameStudio": {
    "status": "IMPLEMENTED_UNVERIFIED",
    "engine": "HTML5 Canvas 2D",
    "generation": "Deterministic original collection-game template; no AI provider configured",
    "preview": "Authenticated version route in an iframe sandbox with network access blocked",
    "supportedRefinement": "Difficulty adjustment; previous versions are retained",
    "unsupported": [
      "3D engines and models",
      "Provider-backed AI agents and generated media",
      "Multiplayer, scores, leaderboards, and achievements",
      "Public discovery and external publishing",
      "Remix integration and monetization"
    ]
  },
  "pipeline": {
    "ci": "Node.js 22.13 and 24 syntax, blueprint, and test jobs; verified release artifact",
    "deployment": "Explicit main-branch dispatch, protected environment approval, SSH deployment, rollback, and production-readiness health gate",
    "deploymentStatus": "BLOCKED"
  },
  "release": {
    "productionReady": false,
    "blockers": [
      "Automated email verification and delivery-based password recovery are not configured",
      "No managed database backups or automated super-admin identity verification",
      "No configured email delivery for password recovery",
      "Authentication rate limiting is process-local and not shared across instances",
      "No configured AI provider or code-generation workers",
      "Game Studio is limited to a deterministic 2D template; broad engines, media, services, and agents are not configured",
      "No production host, deployment credentials, protected-environment approval, or production-ready health response is configured",
      "No published game destination or external integration is verified"
    ]
  }
}
