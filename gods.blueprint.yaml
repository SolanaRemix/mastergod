{
  "blueprintVersion": "1.0",
  "project": {
    "id": "master-gods",
    "name": "Master GODS",
    "version": "9.0.0",
    "purpose": "Help users describe an application, review its requirements, and retain an evidence-aware project blueprint."
  },
  "requirements": [
    {
      "id": "REQ-BUILDER-001",
      "description": "Users can describe an application in ordinary language and receive an editable requirement draft.",
      "status": "VERIFIED"
    },
    {
      "id": "REQ-BLUEPRINT-001",
      "description": "Approved project requirements and planning artifacts are persisted in a project-specific gods.blueprint.yaml file.",
      "status": "VERIFIED"
    },
    {
      "id": "REQ-ORCHESTRATION-001",
      "description": "Project task contracts and dependency-aware task states are retained for review.",
      "status": "PARTIALLY_IMPLEMENTED"
    },
    {
      "id": "REQ-PROVIDERS-001",
      "description": "Configured AI providers execute code-generation and verification tasks.",
      "status": "BLOCKED"
    },
    {
      "id": "REQ-IDENTITY-001",
      "description": "Users authenticate and receive server-enforced project ownership, persisted in a local SQLite database; administrator provisioning and email-based account recovery remain pending.",
      "status": "IMPLEMENTED_UNVERIFIED"
    }
  ],
  "runtime": {
    "language": "JavaScript",
    "minimumNodeVersion": "22.13.0",
    "dependencies": [],
    "persistence": "SQLite users, sessions, and project records with one-time import from legacy JSON files"
  },
  "release": {
    "productionReady": false,
    "blockers": [
      "No managed database backups, email verification, password recovery, or administrator provisioning",
      "No configured email delivery for password recovery",
      "Authentication rate limiting is process-local and not shared across instances",
      "No configured AI provider or code-generation workers",
      "No external integrations or deployment adapter"
    ]
  }
}
