name: CI and gated production deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the verified main-branch artifact to the protected production environment
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gods-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.13.0", "24.x"]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Check JavaScript syntax and blueprint
        run: npm run check
      - name: Run automated tests
        run: npm test

  package:
    name: Package verified release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
      - name: Build release archive
        run: npm run build
      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gods-verified-release
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy verified release
    needs: package
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out deployment script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download verified release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gods-verified-release
          path: dist
      - name: Refuse deployment without target and verified host configuration
        env:
          GODS_DEPLOY_HOST: ${{ secrets.GODS_DEPLOY_HOST }}
          GODS_DEPLOY_USER: ${{ secrets.GODS_DEPLOY_USER }}
          GODS_DEPLOY_KEY: ${{ secrets.GODS_DEPLOY_KEY }}
          GODS_DEPLOY_KNOWN_HOSTS: ${{ secrets.GODS_DEPLOY_KNOWN_HOSTS }}
          GODS_DEPLOY_PATH: ${{ secrets.GODS_DEPLOY_PATH }}
          GODS_DEPLOY_HEALTH_URL: ${{ secrets.GODS_DEPLOY_HEALTH_URL }}
        run: bash scripts/deploy-release.sh preflight
      - name: Deploy and verify health
        env:
          GODS_DEPLOY_HOST: ${{ secrets.GODS_DEPLOY_HOST }}
          GODS_DEPLOY_USER: ${{ secrets.GODS_DEPLOY_USER }}
          GODS_DEPLOY_KEY: ${{ secrets.GODS_DEPLOY_KEY }}
          GODS_DEPLOY_KNOWN_HOSTS: ${{ secrets.GODS_DEPLOY_KNOWN_HOSTS }}
          GODS_DEPLOY_PATH: ${{ secrets.GODS_DEPLOY_PATH }}
          GODS_DEPLOY_HEALTH_URL: ${{ secrets.GODS_DEPLOY_HEALTH_URL }}
        run: bash scripts/deploy-release.sh deploy
